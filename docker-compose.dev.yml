# Локальная разработка: runserver с автоперезагрузкой, код монтируется из папки проекта.
# Сайт: http://localhost:8000
services:
  web:
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  db:
    ports:
      - "5432:5432" # чтобы подключаться к базе из DBeaver/pgAdmin или запускать manage.py без Docker
